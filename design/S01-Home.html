<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ILMA · S-01 Home</title>
<script>if (window.self !== window.top) document.documentElement.classList.add("inframe");</script>
<link rel="stylesheet" href="ilma.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&amp;family=Noto+Sans:wght@400;600&amp;family=Tiro+Bangla&amp;display=swap">
<style>
body{margin:0;background:#06110F}
</style>
<style>body{margin:0;background:#06110F;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:56px 0 32px}.allscr{position:fixed;top:12px;left:12px;z-index:9;font:600 14px "Noto Sans",system-ui,sans-serif;color:#F6CB55;background:rgba(15,38,36,.9);border:1px solid rgba(246,203,85,.5);border-radius:999px;padding:8px 14px;text-decoration:none}[hidden]{display:none!important}.inframe body{padding:0;display:block;min-height:0}.inframe .allscr{display:none}</style>
</head>
<body>
<a class="allscr" href="../index.html">← All screens</a>
<template id="dc-tpl">
<div class="scr">
  <a href="S02-Listening.html" aria-label="{{tapLabel}}" style="position: absolute; left: 0; right: 0; top: 0; bottom: 104px; display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #F6F0E4">
    <svg viewBox="0 0 260 260" width="280" height="280" aria-hidden="true" style="margin-top: 112px">
      <defs>
        <radialGradient id="hg" cx="50%" cy="50%" r="50%"><stop offset="55%" stop-color="#7FD3E3" stop-opacity="0.22"></stop><stop offset="100%" stop-color="#7FD3E3" stop-opacity="0"></stop></radialGradient>
        <radialGradient id="hs" cx="38%" cy="32%" r="75%"><stop offset="0%" stop-color="#4A8E8A"></stop><stop offset="55%" stop-color="#1D4744"></stop><stop offset="100%" stop-color="#0C2321"></stop></radialGradient>
        <linearGradient id="hr" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F6CB55"></stop><stop offset="100%" stop-color="#7FD3E3"></stop></linearGradient>
        <linearGradient id="hw" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#E9D08A"></stop><stop offset="100%" stop-color="#7FD3E3"></stop></linearGradient>
        <radialGradient id="hb1"><stop offset="0%" stop-color="#46AAC0" stop-opacity="0.55"></stop><stop offset="100%" stop-color="#46AAC0" stop-opacity="0"></stop></radialGradient>
        <radialGradient id="hb2"><stop offset="0%" stop-color="#F6D682" stop-opacity="0.32"></stop><stop offset="100%" stop-color="#F6D682" stop-opacity="0"></stop></radialGradient>
        <clipPath id="hc"><circle cx="130" cy="130" r="100"></circle></clipPath>
      </defs>
      <circle cx="130" cy="130" r="128" fill="url(#hg)"></circle>
      <circle cx="130" cy="130" r="100" fill="url(#hs)"></circle>
      <g clip-path="url(#hc)">
        <circle cx="100" cy="152" r="72" fill="url(#hb1)"></circle>
        <circle cx="170" cy="104" r="62" fill="url(#hb2)"></circle>
        <path class="wv" stroke="url(#hw)" d="M20 130 C 55 92, 95 92, 130 130 S 205 168, 240 130"></path>
        <path class="wv b" stroke="url(#hw)" d="M20 130 C 55 162, 95 166, 130 130 S 205 98, 240 130"></path>
        <path class="wv c" stroke="url(#hw)" d="M20 130 C 60 114, 100 116, 130 130 S 200 146, 240 130"></path>
      </g>
      <circle cx="130" cy="130" r="100" fill="none" stroke="url(#hr)" stroke-width="1.6" opacity="0.75"></circle>
      <ellipse cx="98" cy="80" rx="38" ry="17" fill="#FFFFFF" opacity="0.12" transform="rotate(-28 98 80)"></ellipse>
    </svg>
    <p style="margin-top: 26px; font-size: 22px; font-weight: 600; line-height: 1.5; text-align: center; padding: 0 24px">{{idle}}</p>
    <p class="latin muted" style="margin-top: 4px; font-size: 16px">{{idle2}}</p>
    <p style="margin-top: 26px; font-size: 18px; color: #E9D08A; text-align: center; padding: 0 24px">{{example}}</p>
  </a>
  <div style="position: absolute; top: 20px; left: 20px; right: 16px; display: flex; align-items: center; justify-content: space-between">
    <div class="wordmark"><b>ইলমা</b><span>ILMA</span></div>
    <button class="pill latin" aria-pressed="{{pressed}}" onClick="{{toggle}}">{{langBtn}}</button>
  </div>
  <nav class="dock" aria-label="{{navLabel}}">
    <a href="S01-Home.html" class="on" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>
      <span>{{nHome}}</span>
    </a>
    <a href="Savings-Tab.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"></rect><path d="M3 10h18M16 15h2"></path></svg>
      <span>{{nSave}}</span>
      <span class="badge">২</span>
    </a>
    <a href="S21-Ask.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>
      <span>{{nAsk}}</span>
    </a>
    <a href="S22-Settings.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>
      <span>{{nSet}}</span>
    </a>
  </nav>
</div>
</template>
<div id="dc-root"></div>
<script id="dc-logic" type="text/plain">
class Component extends DCLogic {
  renderVals() {
    const en = !!(this.state && this.state.en);
    return {
      toggle: () => this.setState({ en: !en }),
      pressed: en ? 'true' : 'false',
      langBtn: en ? 'বাংলা' : 'English',
      tapLabel: en ? 'Tap anywhere to speak' : 'কথা বলতে যেকোনো জায়গায় ট্যাপ করুন',
      idle: en ? 'Tap anywhere to speak' : 'কথা বলতে যেকোনো জায়গায় ট্যাপ করুন',
      idle2: en ? 'You can also speak Bangla' : 'Tap anywhere to speak',
      example: en ? 'Try: “How is Eastern Bank doing?”' : 'যেমন বলুন: “ইস্টার্ন ব্যাংক কেমন আছে?”',
      navLabel: en ? 'Main menu' : 'প্রধান মেনু',
      nHome: en ? 'Home' : 'হোম',
      nSave: en ? 'My savings' : 'আমার সঞ্চয়',
      nAsk: en ? 'Ask' : 'জিজ্ঞাসা',
      nSet: en ? 'Settings' : 'সেটিংস'
    };
  }
}
</script>
<script src="mini-dc.js"></script>
</body>
</html>

<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d2b29">
<title>ইলমা — Voice-first Home Prototype</title>
<style>
:root { color-scheme:dark; --gold:#f5c85f; --pale:#d5e4dd; --mint:#8be3d8; --bg:#102e2c; --focus:#ffeaa0; }
* { box-sizing:border-box; }
html,body {height:100%; margin:0}
body {font-family:system-ui, 'Noto Sans Bengali', 'Hind Siliguri', sans-serif;color:#f8f8ee;background:#061b1a}
button {font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible, a:focus-visible, #voiceSurface:focus-visible {outline:3px solid var(--focus);outline-offset:4px}
.app {position:relative; isolation:isolate; min-height:100svh; max-width:520px; margin-inline:auto; overflow:hidden; background:radial-gradient(ellipse 66% 42% at 49% 46%,#164844 0%, #133e3a 37%, transparent 85%), radial-gradient(ellipse 90% 68% at 50% 2%,#235854 0%,transparent 90%),linear-gradient(180deg,#173d3a 0%,#0c2a28 100%);}
.app:after {content:"";z-index:-1;pointer-events:none; position:absolute;inset:0;background:linear-gradient(180deg, transparent 72%,rgba(0,8,8,.25));}
header {position:absolute;inset:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding: max(20px, env(safe-area-inset-top)) 22px 10px;z-index:5}
.brand {display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.brand .bangla {font-family:'Noto Serif Bengali','Noto Sans Bengali',serif;color:var(--gold);font-weight:800;font-size:clamp(25px,6.5vw,36px);letter-spacing:-1px}
.brand .latin {color:#c3d1ca;font-family:Georgia,serif;font-size:clamp(16px,4.2vw,23px);letter-spacing:3px;font-weight:bold}
.top-actions {display:flex;gap:10px}
.round {width:56px;height:56px;border:1px solid #718581; border-radius:50%;background:#082625;color:#e9f0ed;display:grid;place-items:center;font-size:19px;font-weight:700;flex:none}
.round.language {border-color:#bd9940;color:var(--gold)}
.round svg {width:24px;height:24px}
#voiceSurface {position:absolute;inset:90px 0 136px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:40px;cursor:pointer;outline-offset:-7px;touch-action:manipulation}
.wave {width:100%; max-width:490px;height:170px;overflow:visible;filter:drop-shadow(0 0 9px rgba(122,219,203,.11))}
.wave .line {fill:none;stroke-linecap:round;vector-effect:non-scaling-stroke}
.wave .gold {stroke:#f4d577;stroke-width:2.5;opacity:.97}
.wave .cyan {stroke:#89e2da;stroke-width:2.4;opacity:.92}
.wave .ghost {stroke:#46b7b0;stroke-width:1.4;opacity:.23}
.wave .baseline {stroke:#8eb7a6;stroke-width:.7;opacity:.18}
.wave .particle {fill:#e6da90;opacity:.7}
.wave .particle.mint {fill:#9cfff0;opacity:.6}
.instructions {padding:0 16px;max-width:100%;text-align:center; font-family:'Noto Serif Bengali','Noto Sans Bengali',serif;font-size:clamp(18px,4.4vw,24px);line-height:1.65;color:#f8f8ed;font-weight:600}
.substatus {font-family:system-ui,'Noto Sans Bengali',sans-serif;color:#a9cbc3; font-size:14px;min-height:22px;margin-top:-29px;text-align:center}
nav {position:absolute;bottom:max(15px, env(safe-area-inset-bottom));left:14px;right:14px;border:1px solid rgba(185,157,71,.42);border-radius:32px;background:rgba(5,30,28,.72);display:grid;grid-template-columns:repeat(4,1fr);min-height:94px;padding:13px 8px;gap:0;z-index:6}
.nav-item {display:flex; flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0;background:none;border:0;border-radius:18px;color:#b0c9c3;padding:3px 0;font-size:12px;font-weight:650;line-height:1.35}
.nav-item svg {width:24px;height:24px;stroke:currentColor;stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.nav-item[aria-current="page"] {color:var(--gold)}
@media(min-height:750px) {#voiceSurface {gap:54px}}
@media(max-width:350px){header {padding-inline:12px}.round{width:45px;height:45px}.top-actions{gap:6px}.brand{gap:6px}nav{left:8px;right:8px}}
@media(prefers-reduced-motion:no-preference){
 .wave .gold {animation:floatGold 6s ease-in-out infinite;transform-origin:center}
 .wave .cyan {animation:floatCyan 5.4s ease-in-out infinite;transform-origin:center}
 .app[data-state="listening"] .wave .gold{animation-duration:1.05s}
 .app[data-state="listening"] .wave .cyan{animation-duration:.79s}
 .app[data-state="speaking"] .wave .gold{animation-duration:1.45s}
 .app[data-state="speaking"] .wave .cyan{animation-duration:1.15s}
 .app[data-state="thinking"] .wave .gold{animation-duration:2.8s}
 @keyframes floatGold {50%{transform:translateY(-9px) scaleY(1.12)}}
 @keyframes floatCyan {50%{transform:translateY(8px) scaleY(.85)}}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="app" id="app" data-state="idle">
  <header>
    <div class="brand" aria-label="ইলমা ILMA"><span class="bangla" aria-hidden="true">ইলমা</span><span class="latin" aria-hidden="true">ILMA</span></div>
    <div class="top-actions">
      <button class="round language" id="languageButton" type="button" aria-label="Switch language to English" title="Change language">EN</button>
      <button class="round" id="settingsButton" type="button" aria-label="সেটিংস" title="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2.2" fill="#e8f5ef"/><circle cx="16" cy="12" r="2.2" fill="#e8f5ef"/><circle cx="9" cy="18" r="2.2" fill="#e8f5ef"/></svg>
      </button>
    </div>
  </header>

  <!-- The large center surface is a SINGLE keyboard-accessible voice control. Its role/state
       are explicit; the visual waveform is decorative for screen-reader users. -->
  <div id="voiceSurface" role="button" tabindex="0" aria-label="ইলমার সঙ্গে কথা বলতে চাপুন" aria-describedby="hint" aria-pressed="false">
    <svg class="wave" viewBox="0 0 420 160" role="presentation" aria-hidden="true" preserveAspectRatio="none">
      <defs><radialGradient id="glow"><stop stop-color="#6ce0c9" stop-opacity=".16"/><stop offset="1" stop-color="#6ce0c9" stop-opacity="0"/></radialGradient></defs>
      <ellipse cx="210" cy="81" rx="148" ry="69" fill="url(#glow)"/>
      <path class="line baseline" d="M6 82 H414"/>
      <path class="line ghost" d="M5 82 C50 82 64 36 107 43 S169 123 209 83 S275 37 307 50 S370 83 415 82"/>
      <path class="line ghost" d="M5 82 C57 80 78 134 115 124 S169 34 209 77 S274 131 315 118 S368 81 415 82"/>
      <path class="line gold" d="M6 82 C45 81 72 82 98 94 S140 117 170 79 S206 19 229 26 S267 96 298 107 S349 63 385 78 S408 82 414 82"/>
      <path class="line cyan" d="M6 82 C51 83 72 66 101 69 S146 121 178 98 S212 57 243 62 S286 121 319 110 S356 74 414 82"/>
      <circle class="particle" cx="88" cy="44" r="2"/><circle class="particle mint" cx="116" cy="63" r="1.2"/><circle class="particle" cx="356" cy="47" r="1.6"/><circle class="particle mint" cx="374" cy="111" r="1.9"/><circle class="particle" cx="107" cy="132" r="2"/>
    </svg>
    <div class="instructions" id="hint">কথা বলতে যেকোনো জায়গায় ট্যাপ করুন</div>
    <div class="substatus" id="substatus" aria-hidden="true"></div>
  </div>

  <nav aria-label="প্রধান নেভিগেশন">
    <button class="nav-item" type="button" aria-current="page" data-page="home" aria-label="হোম, বর্তমান পৃষ্ঠা"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V21h-6v-6H9v6H3z"/></svg><span>হোম</span></button>
    <button class="nav-item" type="button" data-page="services" aria-label="ব্যাংক সেবা"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 11h18M7 16h4"/></svg><span>ব্যাংক সেবা</span></button>
    <button class="nav-item" type="button" data-page="banks" aria-label="ব্যাংক বিবরণী"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m2 9 10-6 10 6M3 21h18M5 10v9M10 10v9M14 10v9M19 10v9M2 9h20"/></svg><span>ব্যাংক<br>বিবরণী</span></button>
    <button class="nav-item" type="button" data-page="news" aria-label="খবর"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h12v16H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2ZM17 7h4v12a2 2 0 0 1-2 2H7M8 7h6M8 11h6M8 15h6"/></svg><span>খবর</span></button>
  </nav>
  <div id="announcements" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
</main>
<style>.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}</style>
<script>
/* REFERENCE INTERACTION ONLY: No microphone capture, speech recognition, or navigation backend.
   Wire these to your real voice pipeline and route handler during integration. */
(() => {
  const app=document.getElementById('app');
  const surface=document.getElementById('voiceSurface');
  const hint=document.getElementById('hint');
  const status=document.getElementById('substatus');
  const live=document.getElementById('announcements');
  const languageButton=document.getElementById('languageButton');
  let locale='bn';
  let state='idle';
  const copy={bn:{idle:'কথা বলতে যেকোনো জায়গায় ট্যাপ করুন',listening:'ইলমা শুনছে…',thinking:'ইলমা ভাবছে…',speaking:'ইলমা উত্তর দিচ্ছে…',tap:'ইলমার সঙ্গে কথা বলতে চাপুন',stop:'শোনা বন্ধ করতে চাপুন',lang:'Switch language to English',settings:'সেটিংস'},en:{idle:'Tap anywhere to speak',listening:'ILMA is listening…',thinking:'ILMA is thinking…',speaking:'ILMA is speaking…',tap:'Start talking to ILMA',stop:'Stop listening',lang:'বাংলায় পরিবর্তন করুন',settings:'Settings'}};
  function setState(next){state=next;app.dataset.state=next;surface.setAttribute('aria-pressed',String(next==='listening'));hint.textContent=copy[locale][next];status.textContent=next==='listening'?(locale==='bn'?'আবার ট্যাপ করলে বন্ধ হবে':'Tap again to stop'):'';surface.setAttribute('aria-label',copy[locale][next==='listening'?'stop':'tap']);live.textContent=copy[locale][next];}
  function toggleVoice(){setState(state==='listening'?'idle':'listening');}
  surface.addEventListener('click',toggleVoice);
  surface.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleVoice();}});
  languageButton.addEventListener('click',()=>{locale=locale==='bn'?'en':'bn';document.documentElement.lang=locale;languageButton.textContent=locale==='bn'?'EN':'বাং';languageButton.setAttribute('aria-label',copy[locale].lang);document.getElementById('settingsButton').setAttribute('aria-label',copy[locale].settings);setState('idle');});
  document.getElementById('settingsButton').addEventListener('click',()=>{live.textContent=locale==='bn'?'সেটিংস পেজটি প্রোটোটাইপে যুক্ত নেই':'Settings is not connected in this prototype';});
  document.querySelectorAll('.nav-item').forEach(button=>button.addEventListener('click',()=>{if(button.dataset.page!=='home'){live.textContent=locale==='bn'?'এই বিভাগটি প্রোটোটাইপে যুক্ত নেই':'This section is not connected in the prototype';}else {setState('idle');surface.focus();}}));
  // Optional integration hook. Example: window.ILMAPrototype.setVoiceState('thinking')
  window.ILMAPrototype={setVoiceState:setState};
})();
</script>
</body>
</html>

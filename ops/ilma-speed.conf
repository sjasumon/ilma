# Install as /etc/systemd/system/ilma-app.service.d/speed.conf.
[Service]
CacheDirectory=ilma
CacheDirectoryMode=0700
Environment=API_ADMISSION_BACKEND=mysql
Environment=TTS_PREWARM=true
ExecStart=
ExecStart=/home/ubuntu/venv/bin/python3 -m uvicorn ilma_api.main:app --host 127.0.0.1 --port 8001 --workers 2

<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ILMA · Offline</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0F2624;
      color: #FFFFFF;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
    }
    h1 {
      font-size: 2.2rem;
      color: #2AD2A4;
      margin-bottom: 24px;
      font-weight: 700;
    }
    p {
      color: #D4EEE6;
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 32px;
      max-width: 400px;
    }
    button {
      background-color: #2AD2A4;
      color: #0F2624;
      border: none;
      font-size: 1.1rem;
      font-weight: bold;
      padding: 16px 32px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(42, 210, 164, 0.3);
      transition: transform 0.1s ease;
    }
    button:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>
  <h1>ইলমা · ILMA</h1>
  <p>ইন্টারনেট নেই। সংযোগ পেলে আবার চেষ্টা করুন।<br><br>No internet. Try again when you're connected.</p>
  <button onclick="location.href='https://app.sumon.me'">আবার চেষ্টা করুন · Try again</button>
</body>
</html>

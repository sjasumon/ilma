name: Repository and app checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - run: python -m pip install -r requirements-dev.txt
      - run: PYTHONPATH=api python -m pytest -q
      - run: |
          node tests/test_frontend.cjs
          node tests/test_greeting_cycle.cjs
          node tests/test_voice_search.cjs
          node tests/test_audio_recorder.cjs
          node tests/test_offline.cjs
      - run: python ops/install_gitleaks.py
      - run: ILMA_GITLEAKS="$PWD/.tools/gitleaks" python ops/check_repo.py --with-secrets
